<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes heroShimmer {
        0% { stop-color: #00d4ff; }
        33% { stop-color: #7928ca; }
        66% { stop-color: #ff0080; }
        100% { stop-color: #00d4ff; }
      }
      @keyframes heroScan {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.75; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes heroPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.25); opacity: 0.4; }
      }
      @keyframes heroBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(10px, -8px); }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Segoe UI', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shimmer-text {
        fill: url(#heroGradientDark);
      }
    ]]></style>
    <linearGradient id="heroGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7928ca;#ff0080;#00d4ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00d4ff;#7928ca" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#00d4ff;#7928ca;#ff0080" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="50%" stop-color="#0c1117" />
      <stop offset="100%" stop-color="#080c12" />
    </linearGradient>
    <linearGradient id="scanGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff0080" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="ambientOrb1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientOrb2" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridDotDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#30363d" opacity="0.6" />
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="16" fill="url(#bgDark)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridDotDark)" />
  <rect width="1200" height="420" rx="16" fill="url(#ambientOrb1)" />
  <rect width="1200" height="420" rx="16" fill="url(#ambientOrb2)" />
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#21262d" stroke-width="1.5" />
  <g style="animation: heroScan 6s linear infinite;">
    <rect x="0" y="0" width="1200" height="2" fill="url(#scanGradDark)" />
  </g>
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#0d1117" opacity="0.8" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#21262d" stroke-width="1" />
  <circle cx="28" cy="22" r="6" fill="#ff5f56" />
  <circle cx="48" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="22" r="6" fill="#27c93f" />
  <text x="96" y="27" class="mono" font-size="12" fill="#8b949e">dhani@edge-cluster:~ (production-node-078)</text>
  <g transform="translate(930, 12)">
    <rect width="240" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="12" r="4.5" fill="#10b981" />
    <circle cx="16" cy="12" r="8" fill="#10b981" opacity="0.3" style="animation: heroPulse 2s ease-in-out infinite; transform-origin: 16px 12px;" />
    <text x="30" y="16" class="sans" font-size="11" font-weight="600" fill="#34d399">OPEN TO SWE INTERNSHIP</text>
  </g>
  <g transform="translate(48, 80)">
    <text x="0" y="20" class="mono" font-size="15" fill="#58a6ff" font-weight="600">
      $ <tspan fill="#c9d1d9">whoami --profile=production</tspan>
    </text>
    <text x="0" y="90" class="sans shimmer-text" font-size="64" font-weight="900" letter-spacing="-1.5">
      DAN.DEV
    </text>
    <text x="0" y="128" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">
      Muhammad Rizki Ramadhani
    </text>
    <text x="0" y="156" class="sans" font-size="15" font-weight="500" fill="#8b949e">
      Full-Stack &amp; Edge Cloud Engineer • High-Concurrency Architect
    </text>
    <g transform="translate(0, 185)">
      <g>
        <rect width="168" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="18" class="mono" font-size="11" fill="#7ee787">📍 Banjarmasin, ID</text>
      </g>
      <g transform="translate(178, 0)">
        <rect width="180" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="18" class="mono" font-size="11" fill="#79c0ff">🎓 UNISKA CS • Sem 7</text>
      </g>
      <g transform="translate(368, 0)">
        <rect width="168" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="14" y="18" class="mono" font-size="11" fill="#ffa657">⚡ 6+ Live Systems</text>
      </g>
    </g>
    <g transform="translate(0, 240)">
      <text x="0" y="20" class="sans" font-size="13.5" fill="#8b949e">
        Delivering sub-50ms edge architectures, 3D physics runtimes, and zero-oversell distributed backends.
      </text>
      <text x="0" y="42" class="sans" font-size="13.5" fill="#8b949e">
        Battle-tested across municipal e-archives, heavy equipment ERPs, and real-time payment platforms.
      </text>
    </g>
  </g>
  <g transform="translate(640, 72)">
    <rect width="512" height="308" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <rect width="512" height="32" rx="12" fill="#161b22" />
    <circle cx="18" cy="16" r="4.5" fill="#ff5f56" />
    <circle cx="34" cy="16" r="4.5" fill="#ffbd2e" />
    <circle cx="50" cy="16" r="4.5" fill="#27c93f" />
    <text x="70" y="20" class="mono" font-size="11" fill="#8b949e">architecture.config.ts</text>
    <g transform="translate(20, 56)" class="mono" font-size="12.5" line-height="1.5">
      <text y="0" fill="#ff7b72">export const <tspan fill="#79c0ff">engineer</tspan> = {</text>
      <text y="24" fill="#8b949e">  handle: <tspan fill="#a5d6ff">"Dhani078"</tspan>,</text>
      <text y="46" fill="#8b949e">  runtime: <tspan fill="#a5d6ff">"Edge / Serverless / Node 22"</tspan>,</text>
      <text y="70" fill="#8b949e">  coreStack: [</text>
      <text y="92" fill="#8b949e">    <tspan fill="#7ee787">"Next.js 16"</tspan>, <tspan fill="#7ee787">"React 19"</tspan>, <tspan fill="#7ee787">"TypeScript"</tspan>,</text>
      <text y="114" fill="#8b949e">    <tspan fill="#7ee787">"Cloudflare Workers"</tspan>, <tspan fill="#7ee787">"TiDB Serverless"</tspan>,</text>
      <text y="136" fill="#8b949e">    <tspan fill="#7ee787">"Three.js / Rapier"</tspan>, <tspan fill="#7ee787">"FastAPI + Redis v8"</tspan></text>
      <text y="158" fill="#8b949e">  ],</text>
      <text y="182" fill="#8b949e">  keyMetrics: {</text>
      <text y="204" fill="#8b949e">    latency: <tspan fill="#ffa657">"&lt; 50ms edge TTFB"</tspan>,</text>
      <text y="226" fill="#8b949e">    resilience: <tspan fill="#ffa657">"Zero-oversell Lua EVALSHA"</tspan></text>
      <text y="248" fill="#8b949e">  }</text>
      <text y="272" fill="#ff7b72">};<tspan fill="#00d4ff" style="animation: heroBlink 1s infinite;">_</tspan></text>
    </g>
  </g>
</svg>
