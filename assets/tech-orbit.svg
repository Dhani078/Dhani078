<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes orbitInner {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes orbitMiddle {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes orbitOuter {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50%      { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px #38bdf8); }
      }
      @keyframes counterRotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>

    <!-- Core gradient -->
    <radialGradient id="orbitCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Satellite gradients -->
    <linearGradient id="satNext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="satCloudflare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="satTiDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="satRedis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="satTS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="satR3F" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Box card background -->
    <linearGradient id="orbitCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="720" height="380" rx="16" fill="url(#orbitCardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left: Orbital Planetary System (Center: 200, 190) -->
  <g transform="translate(200, 190)">
    
    <!-- Outer Orbit Ring (Radius: 150) -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    
    <!-- Middle Orbit Ring (Radius: 105) -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.4" />
    
    <!-- Inner Orbit Ring (Radius: 65) -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3 4" opacity="0.5" />

    <!-- Outer Orbit Group -->
    <g style="animation: orbitOuter 36s linear infinite; transform-origin: 0px 0px;">
      <!-- Satellite 1: Cloudflare Workers -->
      <g transform="translate(150, 0)">
        <circle cx="0" cy="0" r="15" fill="url(#satCloudflare)" stroke="#ffffff" stroke-width="1.2" />
        <text x="0" y="4" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">CF</text>
        <text x="0" y="24" class="sans" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">Workers</text>
      </g>
      <!-- Satellite 2: Redis Lua -->
      <g transform="translate(-150, 0)">
        <circle cx="0" cy="0" r="15" fill="url(#satRedis)" stroke="#ffffff" stroke-width="1.2" />
        <text x="0" y="4" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">R8</text>
        <text x="0" y="24" class="sans" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">Redis Lua</text>
      </g>
    </g>

    <!-- Middle Orbit Group -->
    <g style="animation: orbitMiddle 26s linear infinite; transform-origin: 0px 0px;">
      <!-- Satellite 3: Next.js 16 -->
      <g transform="translate(0, -105)">
        <circle cx="0" cy="0" r="14" fill="url(#satNext)" stroke="#000000" stroke-width="1.5" />
        <text x="0" y="4" class="sans" font-size="9" font-weight="800" fill="#000000" text-anchor="middle">N16</text>
        <text x="0" y="-18" class="sans" font-size="9" font-weight="600" fill="#f8fafc" text-anchor="middle">Next.js</text>
      </g>
      <!-- Satellite 4: TiDB Cloud -->
      <g transform="translate(0, 105)">
        <circle cx="0" cy="0" r="14" fill="url(#satTiDB)" stroke="#ffffff" stroke-width="1.2" />
        <text x="0" y="4" class="mono" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">TiDB</text>
        <text x="0" y="24" class="sans" font-size="9" font-weight="600" fill="#cbd5e1" text-anchor="middle">Serverless</text>
      </g>
    </g>

    <!-- Inner Orbit Group -->
    <g style="animation: orbitInner 18s linear infinite; transform-origin: 0px 0px;">
      <!-- Satellite 5: TypeScript -->
      <g transform="translate(65, 0)">
        <circle cx="0" cy="0" r="12" fill="url(#satTS)" stroke="#ffffff" stroke-width="1" />
        <text x="0" y="3.5" class="mono" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">TS</text>
      </g>
      <!-- Satellite 6: Three.js / Rapier -->
      <g transform="translate(-65, 0)">
        <circle cx="0" cy="0" r="12" fill="url(#satR3F)" stroke="#ffffff" stroke-width="1" />
        <text x="0" y="3.5" class="mono" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">R3F</text>
      </g>
    </g>

    <!-- Glowing Central Core -->
    <g style="animation: corePulse 3s ease-in-out infinite; transform-origin: 0px 0px;">
      <!-- Core outer halos -->
      <circle cx="0" cy="0" r="38" fill="#38bdf8" opacity="0.15" />
      <circle cx="0" cy="0" r="30" fill="url(#orbitCoreGrad)" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="-2" class="sans" font-size="9.5" font-weight="900" fill="#ffffff" text-anchor="middle">CORE</text>
      <text x="0" y="10" class="mono" font-size="7.5" font-weight="700" fill="#bae6fd" text-anchor="middle">SYSTEMS</text>
    </g>
  </g>

  <!-- Right: Capability Matrix &amp; Verified Performance Pillars -->
  <g transform="translate(390, 32)">
    <!-- Header -->
    <text x="0" y="20" class="sans" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      ARCHITECTURAL RADAR &amp; STACK
    </text>
    <text x="0" y="38" class="mono" font-size="11" fill="#38bdf8">
      Production Specifications • Zero CVE Policy
    </text>

    <!-- Pillar 1: Frontend &amp; 3D Interactive -->
    <g transform="translate(0, 60)">
      <rect width="300" height="58" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="sans" font-size="12" font-weight="700" fill="#f1f5f9">
        Frontend &amp; 3D Runtimes
      </text>
      <text x="28" y="36" class="sans" font-size="10.5" fill="#94a3b8">
        Next.js 16 • React 19 • Three.js • Rapier Physics
      </text>
      <text x="28" y="48" class="mono" font-size="9.5" fill="#34d399">
        ✓ 60 FPS Canvas • 0px Layout Overflow Pass
      </text>
    </g>

    <!-- Pillar 2: Edge &amp; Distributed Cloud -->
    <g transform="translate(0, 130)">
      <rect width="300" height="58" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#f97316" />
      <text x="28" y="21" class="sans" font-size="12" font-weight="700" fill="#f1f5f9">
        Edge &amp; Serverless Runtimes
      </text>
      <text x="28" y="36" class="sans" font-size="10.5" fill="#94a3b8">
        Cloudflare Workers • TiDB Cloud • Node.js 22 LTS
      </text>
      <text x="28" y="48" class="mono" font-size="9.5" fill="#34d399">
        ✓ Sub-50ms Global Edge TTFB • Multi-Tenant RBAC
      </text>
    </g>

    <!-- Pillar 3: High-Concurrency &amp; Atomic Engines -->
    <g transform="translate(0, 200)">
      <rect width="300" height="58" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#ef4444" />
      <text x="28" y="21" class="sans" font-size="12" font-weight="700" fill="#f1f5f9">
        High-Concurrency &amp; Data
      </text>
      <text x="28" y="36" class="sans" font-size="10.5" fill="#94a3b8">
        FastAPI • Redis v8 Lua • Supabase RLS • Neon
      </text>
      <text x="28" y="48" class="mono" font-size="9.5" fill="#34d399">
        ✓ Zero-Oversell EVALSHA • Saga Rollback Safety
      </text>
    </g>

    <!-- Pillar 4: Mobile &amp; Offline-First Systems -->
    <g transform="translate(0, 270)">
      <rect width="300" height="58" rx="8" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#10b981" />
      <text x="28" y="21" class="sans" font-size="12" font-weight="700" fill="#f1f5f9">
        Mobile &amp; Offline Systems
      </text>
      <text x="28" y="36" class="sans" font-size="10.5" fill="#94a3b8">
        Expo 54 Native • Serwist PWA • DOKU QRIS Gateway
      </text>
      <text x="28" y="48" class="mono" font-size="9.5" fill="#34d399">
        ✓ HMAC Timing-Safe Webhook • Biometric Auth
      </text>
    </g>
  </g>
</svg>
