<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes cardPulseGym {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>
    <linearGradient id="gymCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f02" />
      <stop offset="60%" stop-color="#111805" />
      <stop offset="100%" stop-color="#050801" />
    </linearGradient>
    <linearGradient id="gymAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#d4f53c" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="580" height="320" rx="16" fill="url(#gymCardBg)" stroke="#273a07" stroke-width="1.5" />
  
  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="6" rx="8" fill="url(#gymAccentGrad)" />

  <!-- Card Header Area -->
  <g transform="translate(28, 30)">
    <!-- Icon Box -->
    <rect width="44" height="44" rx="10" fill="#365314" fill-opacity="0.3" stroke="#d4f53c" stroke-width="1.2" />
    <text x="22" y="28" font-size="22" text-anchor="middle">⚡</text>

    <!-- Title &amp; Sub -->
    <text x="56" y="22" class="sans" font-size="18" font-weight="800" fill="#f8fafc">
      GymVault
    </text>
    <text x="56" y="38" class="mono" font-size="11" fill="#d4f53c">
      CYBER LIME • MEMBERSHIP &amp; QRIS ACCESS
    </text>

    <!-- Live Status Pill -->
    <g transform="translate(380, 8)">
      <rect width="144" height="26" rx="13" fill="#14532d" stroke="#84cc16" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#d4f53c" style="animation: cardPulseGym 2s infinite;" />
      <text x="26" y="17" class="mono" font-size="10" font-weight="700" fill="#bef264">PRODUCTION APP</text>
    </g>
  </g>

  <!-- Description Body -->
  <g transform="translate(28, 95)">
    <text x="0" y="14" class="sans" font-size="13.5" fill="#cbd5e1" font-weight="500">
      Mobile-First Gym Membership, QR Attendance &amp; Payment Engine.
    </text>
    <text x="0" y="34" class="sans" font-size="13" fill="#94a3b8">
      DOKU QRIS iframe checkout, timing-safe HMAC-SHA256 webhook verification,
    </text>
    <text x="0" y="52" class="sans" font-size="13" fill="#94a3b8">
      65/65 test suite pass, zero layout overflow, and Supabase RLS security.
    </text>
  </g>

  <!-- Key Architectural Highlights Grid -->
  <g transform="translate(28, 175)">
    <!-- Box 1 -->
    <rect width="166" height="58" rx="8" fill="#141d06" stroke="#273a07" stroke-width="1" />
    <text x="14" y="22" class="mono" font-size="10" fill="#a3e635">TEST SUITE</text>
    <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#d4f53c">65/65 Tests Pass</text>

    <!-- Box 2 -->
    <g transform="translate(178, 0)">
      <rect width="166" height="58" rx="8" fill="#141d06" stroke="#273a07" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#a3e635">PAYMENTS</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#ffffff">DOKU QRIS HMAC</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(356, 0)">
      <rect width="166" height="58" rx="8" fill="#141d06" stroke="#273a07" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#a3e635">DESIGN THEME</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#38bdf8">AMOLED #000000</text>
    </g>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 256)">
    <g transform="translate(0, 0)">
      <rect width="84" height="26" rx="6" fill="#1a2e05" stroke="#4d7c0f" stroke-width="0.8" />
      <text x="42" y="17" class="mono" font-size="11" font-weight="600" fill="#d9f99d" text-anchor="middle">Expo 54</text>
    </g>
    <g transform="translate(94, 0)">
      <rect width="104" height="26" rx="6" fill="#1a2e05" stroke="#4d7c0f" stroke-width="0.8" />
      <text x="52" y="17" class="mono" font-size="11" font-weight="600" fill="#d9f99d" text-anchor="middle">React Native</text>
    </g>
    <g transform="translate(208, 0)">
      <rect width="90" height="26" rx="6" fill="#1a2e05" stroke="#4d7c0f" stroke-width="0.8" />
      <text x="45" y="17" class="mono" font-size="11" font-weight="600" fill="#d9f99d" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(308, 0)">
      <rect width="100" height="26" rx="6" fill="#1a2e05" stroke="#4d7c0f" stroke-width="0.8" />
      <text x="50" y="17" class="mono" font-size="11" font-weight="600" fill="#d9f99d" text-anchor="middle">DOKU QRIS</text>
    </g>
    <g transform="translate(418, 0)">
      <rect width="104" height="26" rx="6" fill="#1a2e05" stroke="#4d7c0f" stroke-width="0.8" />
      <text x="52" y="17" class="mono" font-size="11" font-weight="600" fill="#d9f99d" text-anchor="middle">Jest Testing</text>
    </g>
  </g>

  <!-- Action Hint -->
  <text x="550" y="302" class="mono" font-size="10" fill="#d4f53c" text-anchor="end">
    OPEN GYMVAULT →
  </text>
</svg>
