    <text x="10" y="4" font-family="monospace" font-size="12" fill="#8b949e">Vercel Deployed</text>
    
    <text x="130" y="4" font-family="monospace" font-size="12" fill="#8b949e">🎮 Interactive</text>
    
    <text x="245" y="4" font-family="monospace" font-size="12" fill="#8b949e">⚡ Physics</text>
  </g>
  
  <g transform="translate(30, 255)">
