<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Card background -->
  <rect width="500" height="300" rx="12" fill="url(#cardBg)" filter="url(#shadow)"/>
  
  <!-- Accent bar -->
  <rect width="500" height="4" fill="url(#accentBar)"/>
  
  <!-- Border -->
  <rect width="500" height="300" rx="12" fill="none" stroke="rgba(88, 166, 255, 0.2)" stroke-width="1"/>
  
  <!-- Project icon/badge -->
  <circle cx="40" cy="45" r="20" fill="#1f6feb" opacity="0.2"/>
  <text x="40" y="52" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#58a6ff">🏢</text>
  
  <!-- Project title -->
  <text x="75" y="45" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#c9d1d9">
    EquipRent MS
  </text>
  
  <!-- Subtitle -->
  <text x="75" y="65" font-family="'SF Mono', monospace" font-size="13" fill="#8b949e">
    PT. Surya Bangun Sarana
  </text>
  
  <!-- Description -->
  <text x="30" y="100" font-family="'SF Mono', monospace" font-size="14" fill="#c9d1d9">
    <tspan x="30" dy="0">Production equipment rental system with GPS</tspan>
    <tspan x="30" dy="20">tracking, role-based auth, and real-time</tspan>
    <tspan x="30" dy="20">inventory management.</tspan>
  </text>
  
  <!-- Tech stack badges -->
  <g transform="translate(30, 170)">
    <rect width="70" height="24" rx="4" fill="#20232a"/>
    <text x="35" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#61dafb">React 18</text>
    
    <rect x="80" width="85" height="24" rx="4" fill="#007acc"/>
    <text x="122" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">TypeScript</text>
    
    <rect x="175" width="95" height="24" rx="4" fill="#f38020"/>
    <text x="222" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">CF Workers</text>
    
    <rect x="280" width="50" height="24" rx="4" fill="#ff3b3b"/>
    <text x="305" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">TiDB</text>
  </g>
  
  <!-- Stats -->
  <g transform="translate(30, 220)">
    <circle cx="0" cy="0" r="3" fill="#3fb950"/>
    <text x="10" y="4" font-family="monospace" font-size="12" fill="#8b949e">Production Ready</text>
    
    <text x="140" y="4" font-family="monospace" font-size="12" fill="#8b949e">⚡ Edge Deployed</text>
    
    <text x="270" y="4" font-family="monospace" font-size="12" fill="#8b949e">🔐 3 User Roles</text>
  </g>
  
  <!-- Live demo button -->
  <g transform="translate(30, 255)">
    <rect width="100" height="32" rx="6" fill="#238636"/>
    <rect width="100" height="32" rx="6" fill="none" stroke="#2ea043" stroke-width="1"/>
    <text x="50" y="21" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">Live Demo →</text>
  </g>
  
  <!-- GitHub link -->
  <g transform="translate(145, 255)">
    <rect width="90" height="32" rx="6" fill="rgba(255,255,255,0.05)"/>
    <rect width="90" height="32" rx="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="45" y="21" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#8b949e">GitHub →</text>
  </g>
  
  <!-- Decorative corner element -->
  <path d="M 480 20 L 480 40 M 460 20 L 480 20" stroke="rgba(88, 166, 255, 0.3)" stroke-width="2" stroke-linecap="round"/>
</svg>
