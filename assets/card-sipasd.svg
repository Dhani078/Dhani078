<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes cardPulseSipasd {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>
    <linearGradient id="sipCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="60%" stop-color="#0e1b20" />
      <stop offset="100%" stop-color="#070d10" />
    </linearGradient>
    <linearGradient id="sipAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="580" height="320" rx="16" fill="url(#sipCardBg)" stroke="#164e63" stroke-width="1.5" />
  
  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="6" rx="8" fill="url(#sipAccentGrad)" />

  <!-- Card Header Area -->
  <g transform="translate(28, 30)">
    <!-- Icon Box -->
    <rect width="44" height="44" rx="10" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2" />
    <text x="22" y="28" font-size="22" text-anchor="middle">🏛️</text>

    <!-- Title &amp; Agency -->
    <text x="56" y="22" class="sans" font-size="18" font-weight="800" fill="#f8fafc">
      SIPASD (E-Arsip Dispora)
    </text>
    <text x="56" y="38" class="mono" font-size="11" fill="#34d399">
      DISPORA PEMERINTAH PROVINSI KALSEL
    </text>

    <!-- Live Status Pill -->
    <g transform="translate(380, 8)">
      <rect width="144" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#34d399" style="animation: cardPulseSipasd 2s infinite;" />
      <text x="26" y="17" class="mono" font-size="10" font-weight="700" fill="#6ee7b7">GOV PRODUCTION</text>
    </g>
  </g>

  <!-- Description Body -->
  <g transform="translate(28, 95)">
    <text x="0" y="14" class="sans" font-size="13.5" fill="#cbd5e1" font-weight="500">
      Government E-Archive &amp; Digital Document Governance System.
    </text>
    <text x="0" y="34" class="sans" font-size="13" fill="#94a3b8">
      Dual-cloud storage (Cloudinary + Google Drive trash recovery API),
    </text>
    <text x="0" y="52" class="sans" font-size="13" fill="#94a3b8">
      RFC 6266 filename downloads, and immutable bureaucratic audit trails.
    </text>
  </g>

  <!-- Key Architectural Highlights Grid -->
  <g transform="translate(28, 175)">
    <!-- Box 1 -->
    <rect width="166" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" class="mono" font-size="10" fill="#64748b">RECORDS INDEXED</text>
    <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#34d399">411+ Berkas Arsip</text>

    <!-- Box 2 -->
    <g transform="translate(178, 0)">
      <rect width="166" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#64748b">STACK SPEC</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#38bdf8">Next 15 + React 19</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(356, 0)">
      <rect width="166" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#64748b">DOMAIN</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#a78bfa">sipasd.my.id</text>
    </g>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 256)">
    <g transform="translate(0, 0)">
      <rect width="90" height="26" rx="6" fill="#132e2b" stroke="#10b981" stroke-width="0.8" />
      <text x="45" y="17" class="mono" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">Next.js 15</text>
    </g>
    <g transform="translate(100, 0)">
      <rect width="96" height="26" rx="6" fill="#132e2b" stroke="#10b981" stroke-width="0.8" />
      <text x="48" y="17" class="mono" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">TiDB Cloud</text>
    </g>
    <g transform="translate(206, 0)">
      <rect width="96" height="26" rx="6" fill="#132e2b" stroke="#10b981" stroke-width="0.8" />
      <text x="48" y="17" class="mono" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">Cloudinary</text>
    </g>
    <g transform="translate(312, 0)">
      <rect width="110" height="26" rx="6" fill="#132e2b" stroke="#10b981" stroke-width="0.8" />
      <text x="55" y="17" class="mono" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">Google Drive API</text>
    </g>
    <g transform="translate(432, 0)">
      <rect width="90" height="26" rx="6" fill="#132e2b" stroke="#10b981" stroke-width="0.8" />
      <text x="45" y="17" class="mono" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">Tailwind v4</text>
    </g>
  </g>

  <!-- Action Hint -->
  <text x="550" y="302" class="mono" font-size="10" fill="#34d399" text-anchor="end">
    VISIT SIPASD.MY.ID →
  </text>
</svg>
