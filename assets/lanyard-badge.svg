<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes lanyardSwing {
        0%   { transform: rotate(10deg); }
        15%  { transform: rotate(-7deg); }
        30%  { transform: rotate(5deg); }
        45%  { transform: rotate(-3deg); }
        60%  { transform: rotate(1.8deg); }
        75%  { transform: rotate(-0.8deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes glareSweep {
        0%   { transform: translateX(-240px) skewX(-25deg); opacity: 0; }
        20%  { opacity: 0.7; }
        40%  { transform: translateX(360px) skewX(-25deg); opacity: 0; }
        100% { transform: translateX(360px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseChip {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #fbbf24); }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>

    <!-- Holographic glare gradient -->
    <linearGradient id="lanyardGlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="lanyardCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Gold Chip Gradient -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Strap Texture Pattern -->
    <pattern id="strapPattern" width="6" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="12" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
      <line x1="6" y1="0" x2="0" y2="12" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="280" height="240" rx="16" />
    </clipPath>
  </defs>

  <!-- Lanyard Root Group With Damped Pendulum Swing -->
  <g style="transform-origin: 230px 0px; animation: lanyardSwing 5s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;">
    
    <!-- Top Strap -->
    <g transform="translate(216, 0)">
      <!-- Left Strap segment -->
      <path d="M 0,-10 L 8,50 L 18,50 L 10,-10 Z" fill="#0f172a" />
      <path d="M 0,-10 L 8,50 L 18,50 L 10,-10 Z" fill="url(#strapPattern)" />
      <!-- Right Strap segment -->
      <path d="M 18,-10 L 10,50 L 20,50 L 28,-10 Z" fill="#0369a1" />
      <path d="M 18,-10 L 10,50 L 20,50 L 28,-10 Z" fill="url(#strapPattern)" />
    </g>

    <!-- Metal Buckle / Swivel Clasp -->
    <g transform="translate(214, 46)">
      <!-- Metal ring -->
      <rect x="6" y="0" width="20" height="8" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      <!-- Clasp Body -->
      <path d="M 4,8 L 28,8 L 24,24 L 8,24 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="#334155" />
      <!-- Swivel loop into card slot -->
      <path d="M 11,24 L 21,24 L 18,34 L 14,34 Z" fill="#94a3b8" />
      <ellipse cx="16" cy="34" rx="4" ry="2" fill="#475569" />
    </g>

    <!-- Main ID Card Assembly -->
    <g transform="translate(90, 82)">
      <!-- Card Outer Shadow / Glow -->
      <rect x="-4" y="-4" width="288" height="248" rx="20" fill="#00d4ff" opacity="0.12" />

      <!-- Card Container Clip -->
      <g clip-path="url(#cardClip)">
        <!-- Card Base -->
        <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#lanyardCardBg)" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Slot cutout -->
        <rect x="115" y="8" width="50" height="8" rx="4" fill="#0b0f19" stroke="#475569" stroke-width="1" />

        <!-- Header Banner on Card -->
        <rect x="0" y="24" width="280" height="34" fill="#0284c7" opacity="0.85" />
        <text x="140" y="46" class="sans" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">
          ENGINEER ACCESS PASS
        </text>

        <!-- Developer Avatar / Emblem Box -->
        <g transform="translate(20, 72)">
          <rect width="64" height="64" rx="10" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
          <!-- Circuit glyph for avatar -->
          <circle cx="32" cy="26" r="12" fill="#0284c7" opacity="0.7" />
          <path d="M 16,56 Q 32,38 48,56 Z" fill="#0ea5e9" opacity="0.8" />
          <!-- Verified green tick -->
          <circle cx="54" cy="54" r="7" fill="#10b981" />
          <path d="M 51,54 L 53,56 L 57,51" stroke="#ffffff" stroke-width="1.5" fill="none" />
        </g>

        <!-- Golden Smart-Card IC Chip -->
        <g transform="translate(200, 74)">
          <rect width="46" height="36" rx="4" fill="url(#goldChip)" stroke="#b45309" stroke-width="1" style="animation: pulseChip 3s infinite alternate;" />
          <!-- Chip Contacts Lines -->
          <line x1="15" y1="0" x2="15" y2="36" stroke="#92400e" stroke-width="1" />
          <line x1="31" y1="0" x2="31" y2="36" stroke="#92400e" stroke-width="1" />
          <line x1="0" y1="18" x2="46" y2="18" stroke="#92400e" stroke-width="1" />
          <rect x="18" y="10" width="10" height="16" rx="2" fill="#fef08a" opacity="0.8" />
        </g>

        <!-- Developer Details Text -->
        <g transform="translate(96, 76)">
          <text x="0" y="14" class="sans" font-size="14" font-weight="800" fill="#f8fafc">
            M. RIZKI RAMADHANI
          </text>
          <text x="0" y="30" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">
            DAN.DEV • @Dhani078
          </text>
          <text x="0" y="46" class="sans" font-size="9.5" fill="#94a3b8">
            Full-Stack &amp; Systems
          </text>
          <text x="0" y="58" class="sans" font-size="9" fill="#64748b">
            UNISKA Banjarmasin • Sem 7
          </text>
        </g>

        <!-- Divider line -->
        <line x1="20" y1="148" x2="260" y2="148" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

        <!-- Clearance &amp; Auth Status -->
        <g transform="translate(20, 162)">
          <text x="0" y="10" class="mono" font-size="9" fill="#64748b">SECURITY CLEARANCE</text>
          <text x="0" y="24" class="mono" font-size="11" font-weight="700" fill="#34d399">LEVEL 4 • PROD-READY</text>
        </g>

        <g transform="translate(180, 162)">
          <text x="0" y="10" class="mono" font-size="9" fill="#64748b">DOMAIN NODE</text>
          <text x="0" y="24" class="mono" font-size="11" font-weight="700" fill="#38bdf8">ASIA-SE-BANJAR</text>
        </g>

        <!-- Realistic Barcode Vector -->
        <g transform="translate(20, 196)">
          <!-- Barcode vertical lines -->
          <rect x="0" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="4" y="0" width="4" height="22" fill="#94a3b8" />
          <rect x="10" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="13" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="18" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="22" y="0" width="5" height="22" fill="#94a3b8" />
          <rect x="29" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="33" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="36" y="0" width="4" height="22" fill="#94a3b8" />
          <rect x="42" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="46" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="51" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="54" y="0" width="5" height="22" fill="#94a3b8" />
          <rect x="61" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="65" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="70" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="73" y="0" width="4" height="22" fill="#94a3b8" />
          <rect x="79" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="83" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="87" y="0" width="5" height="22" fill="#94a3b8" />
          <rect x="94" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="98" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="101" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="106" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="110" y="0" width="4" height="22" fill="#94a3b8" />
          <rect x="116" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="119" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="123" y="0" width="5" height="22" fill="#94a3b8" />
          <rect x="130" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="134" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="139" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="142" y="0" width="4" height="22" fill="#94a3b8" />
          <rect x="148" y="0" width="2" height="22" fill="#94a3b8" />
          <rect x="152" y="0" width="3" height="22" fill="#94a3b8" />
          <rect x="157" y="0" width="1" height="22" fill="#94a3b8" />
          <rect x="160" y="0" width="5" height="22" fill="#94a3b8" />

          <!-- Serial text -->
          <text x="175" y="16" class="mono" font-size="10" fill="#94a3b8" letter-spacing="1">
            SN: 078-DAN-2026
          </text>
        </g>

        <!-- Diagonal Holographic Glare sweep -->
        <g style="animation: glareSweep 5s ease-in-out infinite;">
          <rect x="0" y="0" width="60" height="260" fill="url(#lanyardGlare)" />
        </g>
      </g>
    </g>
  </g>
</svg>
