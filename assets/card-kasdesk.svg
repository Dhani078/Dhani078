<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="auto">
  <defs>
    <style><![CDATA[
      @keyframes cardPulseKas {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .mono { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>
    <linearGradient id="kasCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1f" />
      <stop offset="60%" stop-color="#1c162b" />
      <stop offset="100%" stop-color="#0e0a16" />
    </linearGradient>
    <linearGradient id="kasAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="580" height="320" rx="16" fill="url(#kasCardBg)" stroke="#3b2b58" stroke-width="1.5" />
  
  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="6" rx="8" fill="url(#kasAccentGrad)" />

  <!-- Card Header Area -->
  <g transform="translate(28, 30)">
    <!-- Icon Box -->
    <rect width="44" height="44" rx="10" fill="#581c87" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.2" />
    <text x="22" y="28" font-size="22" text-anchor="middle">💳</text>

    <!-- Title &amp; Sub -->
    <text x="56" y="22" class="sans" font-size="18" font-weight="800" fill="#f8fafc">
      KasDesk PWA
    </text>
    <text x="56" y="38" class="mono" font-size="11" fill="#c084fc">
      OFFLINE-FIRST WEALTH &amp; MULTI-WALLET LEDGER
    </text>

    <!-- Live Status Pill -->
    <g transform="translate(380, 8)">
      <rect width="144" height="26" rx="13" fill="#4c1d95" stroke="#a855f7" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#c084fc" style="animation: cardPulseKas 2s infinite;" />
      <text x="26" y="17" class="mono" font-size="10" font-weight="700" fill="#e9d5ff">PRODUCTION PWA</text>
    </g>
  </g>

  <!-- Description Body -->
  <g transform="translate(28, 95)">
    <text x="0" y="14" class="sans" font-size="13.5" fill="#cbd5e1" font-weight="500">
      Progressive Web App for Personal Finance &amp; Expense Tracking.
    </text>
    <text x="0" y="34" class="sans" font-size="13" fill="#94a3b8">
      Offline-first IndexedDB cache, receipt OCR ingestion via vision models,
    </text>
    <text x="0" y="52" class="sans" font-size="13" fill="#94a3b8">
      biometric authentication, and resilient background synchronization.
    </text>
  </g>

  <!-- Key Architectural Highlights Grid -->
  <g transform="translate(28, 175)">
    <!-- Box 1 -->
    <rect width="166" height="58" rx="8" fill="#181126" stroke="#2e1065" stroke-width="1" />
    <text x="14" y="22" class="mono" font-size="10" fill="#a78bfa">OFFLINE CAPABLE</text>
    <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#e9d5ff">Serwist ServiceWorker</text>

    <!-- Box 2 -->
    <g transform="translate(178, 0)">
      <rect width="166" height="58" rx="8" fill="#181126" stroke="#2e1065" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#a78bfa">ORM &amp; RELATIONS</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#38bdf8">Drizzle ORM + TiDB</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(356, 0)">
      <rect width="166" height="58" rx="8" fill="#181126" stroke="#2e1065" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#a78bfa">SECURITY</text>
      <text x="14" y="42" class="sans" font-size="12" font-weight="700" fill="#34d399">Biometric WebAuthn</text>
    </g>
  </g>

  <!-- Tech Badges Footer -->
  <g transform="translate(28, 256)">
    <g transform="translate(0, 0)">
      <rect width="90" height="26" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.8" />
      <text x="45" y="17" class="mono" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">Next.js 16</text>
    </g>
    <g transform="translate(100, 0)">
      <rect width="84" height="26" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.8" />
      <text x="42" y="17" class="mono" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">React 19</text>
    </g>
    <g transform="translate(194, 0)">
      <rect width="90" height="26" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.8" />
      <text x="45" y="17" class="mono" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">Drizzle ORM</text>
    </g>
    <g transform="translate(294, 0)">
      <rect width="94" height="26" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.8" />
      <text x="47" y="17" class="mono" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">TiDB Cloud</text>
    </g>
    <g transform="translate(398, 0)">
      <rect width="124" height="26" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="0.8" />
      <text x="62" y="17" class="mono" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">IndexedDB PWA</text>
    </g>
  </g>

  <!-- Action Hint -->
  <text x="550" y="302" class="mono" font-size="10" fill="#c084fc" text-anchor="end">
    LAUNCH KAS-DESK →
  </text>
</svg>
