<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentBar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#56d364;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow4">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="500" height="300" rx="12" fill="url(#cardBg4)" filter="url(#shadow4)"/>
  <rect width="500" height="4" fill="url(#accentBar4)"/>
  <rect width="500" height="300" rx="12" fill="none" stroke="rgba(63, 185, 80, 0.2)" stroke-width="1"/>
  
  <circle cx="40" cy="45" r="20" fill="#2ea043" opacity="0.2"/>
  <text x="40" y="52" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#3fb950">💰</text>
  
  <text x="75" y="45" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#c9d1d9">
    KasDesk PWA
  </text>
  
  <text x="75" y="65" font-family="'SF Mono', monospace" font-size="13" fill="#8b949e">
    Personal Finance Tracker
  </text>
  
  <text x="30" y="100" font-family="'SF Mono', monospace" font-size="14" fill="#c9d1d9">
    <tspan x="30" dy="0">Offline-first PWA with multi-wallet tracking,</tspan>
    <tspan x="30" dy="20">OCR receipt scanning, and biometric auth.</tspan>
    <tspan x="30" dy="20">Real-time sync with TiDB Cloud.</tspan>
  </text>
  
  <g transform="translate(30, 170)">
    <rect width="85" height="24" rx="4" fill="#000"/>
    <text x="42" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">Next.js 16</text>
    
    <rect x="95" width="75" height="24" rx="4" fill="#20232a"/>
    <text x="132" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#61dafb">React 19</text>
    
    <rect x="180" width="50" height="24" rx="4" fill="#ff3b3b"/>
    <text x="205" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">TiDB</text>
    
    <rect x="240" width="50" height="24" rx="4" fill="#5a0fc8"/>
    <text x="265" y="16" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">PWA</text>
  </g>
  
  <g transform="translate(30, 220)">
    <circle cx="0" cy="0" r="3" fill="#3fb950"/>
    <text x="10" y="4" font-family="monospace" font-size="12" fill="#8b949e">Live Production</text>
    
    <text x="125" y="4" font-family="monospace" font-size="12" fill="#8b949e">📱 Offline-First</text>
    
    <text x="250" y="4" font-family="monospace" font-size="12" fill="#8b949e">📸 OCR</text>
  </g>
  
  <g transform="translate(30, 255)">
    <rect width="100" height="32" rx="6" fill="#238636"/>
    <rect width="100" height="32" rx="6" fill="none" stroke="#2ea043" stroke-width="1"/>
    <text x="50" y="21" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#fff">Live Demo →</text>
  </g>
  
  <g transform="translate(145, 255)">
    <rect width="90" height="32" rx="6" fill="rgba(255,255,255,0.05)"/>
    <rect width="90" height="32" rx="6" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="45" y="21" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#8b949e">GitHub →</text>
  </g>
  
  <path d="M 480 20 L 480 40 M 460 20 L 480 20" stroke="rgba(63, 185, 80, 0.3)" stroke-width="2" stroke-linecap="round"/>
