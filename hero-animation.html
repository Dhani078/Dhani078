<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAN.DEV - Hero Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0d1117;
      overflow: hidden;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    
    .hero-container {
      width: 1200px;
      height: 400px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    }
    
    .grid-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(88, 166, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88, 166, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    
    @keyframes gridMove {
      0% { transform: perspective(1000px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(1000px) rotateX(60deg) translateY(50px); }
    }
    
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    
    .name {
      font-size: 72px;
      font-weight: 900;
      background: linear-gradient(135deg, #58a6ff 0%, #ff7b72 50%, #ffa657 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin-bottom: 20px;
      animation: fadeInScale 1s ease-out;
      text-shadow: 0 0 60px rgba(88, 166, 255, 0.5);
    }
    
    .tagline {
      font-size: 24px;
      color: #c9d1d9;
      margin-bottom: 30px;
      animation: fadeInUp 1s ease-out 0.3s both;
      font-weight: 300;
      letter-spacing: 1px;
    }
    
    .tech-orbit {
      position: absolute;
      width: 600px;
      height: 600px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .orbit {
      position: absolute;
      border: 1px solid rgba(88, 166, 255, 0.15);
      border-radius: 50%;
      animation: rotate 30s linear infinite;
    }
    
    .orbit-1 { width: 300px; height: 300px; top: 150px; left: 150px; }
    .orbit-2 { width: 450px; height: 450px; top: 75px; left: 75px; animation-duration: 40s; animation-direction: reverse; }
    .orbit-3 { width: 600px; height: 600px; top: 0; left: 0; animation-duration: 50s; }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .tech-icon {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    .tech-icon.next { background: #000; top: 0; left: 50%; transform: translateX(-50%); }
    .tech-icon.react { background: #61dafb; color: #000; top: 50%; right: 0; transform: translateY(-50%); animation-delay: 0.5s; }
    .tech-icon.ts { background: #007acc; bottom: 0; left: 50%; transform: translateX(-50%); animation-delay: 1s; }
    .tech-icon.cf { background: #f38020; top: 50%; left: 0; transform: translateY(-50%); animation-delay: 1.5s; }
    
    @keyframes float {
      0%, 100% { transform: translate(var(--tx, 0), var(--ty, 0)) translateY(0); }
      50% { transform: translate(var(--tx, 0), var(--ty, 0)) translateY(-10px); }
    }
    
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #58a6ff;
      border-radius: 50%;
      animation: particleFloat 15s linear infinite;
      opacity: 0;
    }
    
    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }
    
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      animation: fadeInUp 1s ease-out 0.6s both;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b949e;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <div class="grid-bg"></div>
    
    <div class="particles" id="particles"></div>
    
    <div class="tech-orbit">
      <div class="orbit orbit-1"></div>
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-3"></div>
      <div class="tech-icon next">N</div>
      <div class="tech-icon react">R</div>
      <div class="tech-icon ts">TS</div>
      <div class="tech-icon cf">CF</div>
    </div>
    
    <div class="content">
      <h1 class="name">DAN.DEV</h1>
      <p class="tagline">Muhammad Rizki Ramadhani • Full-stack Engineer</p>
    </div>
    
    <div class="status-bar">
      <div class="status-item">
        <div class="status-dot"></div>
        <span>Available for Internship</span>
      </div>
      <div class="status-item">
        <div class="status-dot"></div>
        <span>Banjarmasin, Indonesia</span>
      </div>
      <div class="status-item">
        <div class="status-dot"></div>
        <span>TI Semester 7</span>
      </div>
    </div>
  </div>
  
  <script>
    // Generate particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (10 + Math.random() * 10) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
